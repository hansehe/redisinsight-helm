# Default values for redisinsight.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

enabled: true
replicaCount: 1

image:
  repository: redis/redisinsight
  pullPolicy: IfNotPresent
  versionOverride: "*"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
terminationGracePeriodSeconds: 10
environmentVariables: {}

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # Enable these permissions if you are running with a non-root user to allow for reading / writing to the volume
  # runAsUser: 1000
  # runAsGroup: 1000

initContainers: []
# Enable this to change the permissions of the volume to allow for reading / writing to the volume
# - name: redisinsight-init-permissions
#   image: busybox
#   command: ["sh", "-c", "chown -R 1000:1000 /data && chmod -R 775 /data"]
#   securityContext:
#     runAsUser: 0  # Run as root to ensure permissions can be changed
#   volumeMounts:
#     - mountPath: "/data"
#       name: redisinsight-volume

service:
  type: ClusterIP
  port: 5540
  annotations:
    prometheus.io/probe: "true"
    prometheus.io/probe-path: "/"
  headless:
    annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt
    # nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
  hosts:
    - host: redisinsight.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: redisinsight-tls
  #    hosts:
  #      - redisinsight.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

volume:
  enabled: true
  className: ""
  size: 100m
  annotations:
    helm.sh/resource-policy: "keep"

tests:
  enabled: true